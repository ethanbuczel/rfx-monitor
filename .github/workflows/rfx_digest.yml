name: RFx Daily Digest

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern (EDT). During standard time (Nov-Mar)
    # this fires at 6:00 AM ET; change to '0 12 * * *' if that bothers you.
    - cron: '0 11 * * *'
  workflow_dispatch:   # adds a manual "Run workflow" button (works from mobile app too)

permissions:
  contents: write      # needed to commit rfx_seen.json back

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run RFx digest
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RFX_RECIPIENT: ${{ secrets.RFX_RECIPIENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODE: tag   # switch to 'drop' once you trust its judgment
        run: python rfx_alert.py

      - name: Commit updated seen-file
        run: |
          git config user.name "rfx-bot"
          git config user.email "actions@github.com"
          git add rfx_seen.json
          git diff --cached --quiet || git commit -m "Update rfx_seen.json [skip ci]"
          git push
