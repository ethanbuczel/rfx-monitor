name: RFx Digest CM

# Construction-Management / vertical digest. Reuses the SAME scrapers and engine
# as the traffic digest, but CM_MODE=1 flips it to the CM keyword filter + CM
# classifier, sends to a separate CM recipient, and tracks its own seen-file
# (rfx_seen_cm.json) so it's fully independent of the traffic digest.

on:
  workflow_dispatch:        # MANUAL ONLY — no schedule. CM runs only when you
                            # click "Run workflow" (works from the GitHub mobile
                            # app too). The traffic digest stays on its daily cron;
                            # this one never fires on its own.

permissions:
  contents: write           # to commit the CM seen-file

jobs:
  digest-cm:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          py -m pip install -r requirements.txt
          py -m playwright install chromium

      - name: Run RFx CM digest
        env:
          CM_MODE: "1"                                   # <<< enables CM pipeline
          RFX_RECIPIENT_CM: ${{ secrets.RFX_RECIPIENT_CM }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISLIP_EMAIL: ${{ secrets.ISLIP_EMAIL }}
          ISLIP_PASSWORD: ${{ secrets.ISLIP_PASSWORD }}
          LLM_MODE: off
          # DIAG: "1"   # uncomment for structure dumps in the logs
        run: py rfx_alert.py

      - name: Commit updated CM seen-file
        # Rebase-and-retry so a code push landing DURING the run (remote moves
        # ahead -> "! [rejected] ... fetch first") can't fail the job or lose the
        # CM seen-file update. Code pushes don't touch rfx_seen_cm.json, so the
        # rebase is always clean.
        run: |
          git config user.name "rfx-bot"
          git config user.email "actions@github.com"
          git add rfx_seen_cm.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update rfx_seen_cm.json [skip ci]"
            $pushed = $false
            for ($i = 0; $i -lt 3; $i++) {
              git pull --rebase --autostash origin main
              git push
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              Write-Host "push rejected (attempt $($i + 1)) - rebasing and retrying..."
              Start-Sleep -Seconds 3
            }
            if (-not $pushed) {
              Write-Host "CM seen-file push still failing after 3 attempts; digest already sent."
            }
          }
