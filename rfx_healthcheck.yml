name: RFx Health Check

# On-demand check that every scraped source still loads and has the structure
# we expect — so a broken scraper can't silently masquerade as a quiet source.
# Emails a status report. Manual trigger only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          py -m pip install -r requirements.txt
          py -m playwright install chromium

      - name: Run health check
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RFX_RECIPIENT: ${{ secrets.RFX_RECIPIENT }}
        run: py rfx_healthcheck.py
